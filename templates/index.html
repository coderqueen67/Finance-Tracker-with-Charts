<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
        }
        input, button {
            padding: 10px;
            margin: 8px 0;
            font-size: 1rem;
        }
        button {
            cursor: pointer;
        }
        ul {
            list-style: none;
            padding-left: 0;
        }
        li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 6px;
        }
        .amount {
            font-weight: bold;
        }
        .delete-btn {
            background: #ff4d4d;
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
        }
        .message {
            margin: 10px 0;
            color: #d00;
        }
    </style>
</head>
<body>
    <h1>💰 Personal Finance Tracker</h1>

    <div>
        <input id="amount" type="number" step="0.01" placeholder="Amount">
        <input id="description" type="text" placeholder="Description">
        <button id="addButton">Add Transaction</button>
    </div>

    <div class="message" id="message"></div>

    <h2>Transactions</h2>
    <ul id="list"></ul>

    <script src="/static/app.js"></script>
</body>
</html>
